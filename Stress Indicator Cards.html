<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stress Indicator Cards</title>
<style>
  :root {
    --green: #089981;
    --red: #f23645;
    --ink: #111318;
    --muted: #6b7280;
    --pill-bg: #f0f1f3;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eef0f3;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: white;
    border-radius: 22px;
    padding: 14px 18px 10px 18px;
    display: grid;
    grid-template-columns: 130px 1fr 120px;
    grid-template-rows: auto auto;
    align-items: center;
    box-shadow: 0 2px 14px rgba(17, 19, 24, 0.06);
    width: 520px;
    position: relative;
  }

  /* Left column: ticker-style pill */
  .left {
    display: flex;
    align-items: center;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--pill-bg);
    border-radius: 999px;
    padding: 6px 12px 6px 6px;
  }
  .pill-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--ink);
    flex-shrink: 0;
  }
  .pill-dot.down { background: var(--green); }
  .pill-dot.up   { background: var(--red); }
  .pill-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .level {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
  }
  .change {
    font-size: 0.85rem;
    font-weight: 600;
  }
  .change.down { color: var(--green); }
  .change.up   { color: var(--red); }

  /* Center sparkline */
  .sparkline-wrap {
    padding: 0 8px;
  }
  .sparkline-wrap svg {
    display: block;
    width: 100%;
    height: 60px;
  }

  /* Right range indicator */
  .range {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    height: 60px;
    justify-content: center;
  }
  .range-line-wrap {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }
  .range-line {
    width: 100%;
    height: 0;
    border-top: 2px dashed #d8dade;
  }
  .range-dot {
    position: absolute;
    width: 11px;
    height: 11px;
    background: var(--ink);
    border-radius: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 3px rgba(17, 19, 24, 0.08);
  }
  .range-dot.down { background: var(--green); box-shadow: 0 0 0 3px rgba(8, 153, 129, 0.15); }
  .range-dot.up   { background: var(--red);   box-shadow: 0 0 0 3px rgba(242, 54, 69, 0.15); }
  .range-labels {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .range-max-label {
    position: absolute;
    top: -2px;
    right: 0;
    font-size: 0.7rem;
    color: var(--muted);
  }

  /* Bottom label */
  .card-label {
    grid-column: 1 / 4;
    text-align: center;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    font-style: normal;
    padding-top: 8px;
    border-top: 1px solid #f0f1f3;
    margin-top: 6px;
  }

  .loading { color: #888; font-style: italic; }
  .error   { color: red; }
</style>
</head>
<body>

<div id="cards-container">
  <p class="loading">Loading data...</p>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTyHCIpuggmnT48JhvbjLixeB_-VOEaWNkBUDssKIyM_JFPz52tiN_aUi-4UBOvGo9sPbwdvJ-7XSuZ/pub?gid=1860034981&single=true&output=csv';

async function fetchData() {
  const resp = await fetch(CSV_URL);
  const text = await resp.text();
  return parseCSV(text);
}

function parseCSV(text) {
  const lines = text.trim().split('\n').map(l => l.split(','));
  const header = lines[0];

  // Find column indices
  const col = name => header.findIndex(h => h.trim() === name.trim());
  const idxCardID     = col('CardID');
  const idxLabel      = col('Label');
  const idxUnit       = col('Unit');
  const idxLevel      = col('Level');
  const idxChangeVal  = col('ChangeVal');
  const idxPeriodLabel= col('PeriodLabel');
  const idxHistMin    = col('HistMin');
  const idxHistMax    = col('HistMax');
  const idxPercentile = col('Percentile');

  // Sparkline values start after the blank column (after Percentile)
  // blank column = idxPercentile + 1, dates header row = idxPercentile + 2...
  // but dates are in header row; values start at idxPercentile + 2 (skip blank)
  const sparkStart = idxPercentile + 2; // skip blank col

  const cards = [];
  for (let i = 1; i < lines.length; i++) {
    const row = lines[i];
    if (!row[idxCardID] || row[idxCardID].trim() === '') continue;

    const sparkValues = row.slice(sparkStart)
      .map(v => parseFloat(v.trim()))
      .filter(v => !isNaN(v));

    cards.push({
      cardID:      row[idxCardID].trim(),
      label:       row[idxLabel].trim(),
      unit:        row[idxUnit].trim(),
      level:       parseFloat(row[idxLevel]),
      changeVal:   parseFloat(row[idxChangeVal]),
      periodLabel: row[idxPeriodLabel].trim(),
      histMin:     parseFloat(row[idxHistMin]),
      histMax:     parseFloat(row[idxHistMax]),
      percentile:  parseFloat(row[idxPercentile]),
      sparkValues
    });
  }
  return cards;
}

function buildSparklineSVG(values, changeClass) {
  if (!values.length) return '<svg></svg>';
  const w = 200, h = 60, pad = 4;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = pad + (i / (values.length - 1)) * (w - pad * 2);
    const y = (h - pad) - ((v - min) / range) * (h - pad * 2);
    return `${x},${y}`;
  });
  const polyline = pts.join(' ');
  const areaClose = `${pts[pts.length-1].split(',')[0]},${h} ${pad},${h}`;
  const lineColor = changeClass === 'down' ? '#089981' : '#f23645';

  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${lineColor}" stop-opacity="0.03"/>
      </linearGradient>
    </defs>
    <polygon points="${polyline} ${areaClose}" fill="url(#sg)"/>
    <polyline points="${polyline}" fill="none" stroke="${lineColor}" stroke-width="1.5"/>
  </svg>`;
}

function buildCard(card) {
  const isDown = card.changeVal <= 0;
  const changeClass = isDown ? 'down' : 'up';
  const arrow = isDown ? '↓' : '↑';
  const changeDisplay = `${arrow} ${Math.abs(card.changeVal).toFixed(2)} (${card.periodLabel})`;

  // Dot position as % along the range line
  const pct = Math.min(100, Math.max(0, card.percentile));

  const sparkSVG = buildSparklineSVG(card.sparkValues, changeClass);

  return `
  <div class="card">
    <div class="left">
      <div class="pill">
        <div class="pill-dot ${changeClass}"></div>
        <div class="pill-text">
          <div class="level">${card.level}</div>
          <div class="change ${changeClass}">${changeDisplay}</div>
        </div>
      </div>
    </div>
    <div class="sparkline-wrap">${sparkSVG}</div>
    <div class="range">
      <div class="range-max-label">${card.histMax}</div>
      <div class="range-line-wrap">
        <div class="range-line"></div>
        <div class="range-dot ${changeClass}" style="left: ${pct}%"></div>
      </div>
      <div class="range-labels">
        <span>${card.histMin}</span>
      </div>
    </div>
    <div class="card-label">${card.label}</div>
  </div>`;
}

fetchData()
  .then(cards => {
    const container = document.getElementById('cards-container');
    container.innerHTML = cards.map(buildCard).join('');
  })
  .catch(err => {
    document.getElementById('cards-container').innerHTML = `<p class="error">Error loading data: ${err.message}</p>`;
  });
</script>
</body>
</html>
